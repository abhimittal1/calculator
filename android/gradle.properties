# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ─── JVM / Daemon tweaks ─────────────────────────────────────────────────────
# Give the Gradle daemon enough heap for large React Native builds.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use JDK 17 (Temurin). React Native 0.73 + Android Gradle Plugin require
# JDK 17. Android Studio's JBR is JDK 21 which breaks the jlink transform
# when compiling native modules like async-storage.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.18.8-hotspot

# Speed up builds with parallel execution and caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ─── AndroidX ────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true

# ─── React Native architectures ──────────────────────────────────────────────
# For Play Store release: build only arm64-v8a + armeabi-v7a (95%+ of devices).
# Keep x86_64 for emulator dev builds; it is filtered out by the ABI splits in
# app/build.gradle for the release variant.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# ─── New Architecture (Fabric / TurboModules) ────────────────────────────────
# Leave false for RN 0.73 — New Arch is opt-in and still experimental.
newArchEnabled=false

# ─── Hermes ──────────────────────────────────────────────────────────────────
# Hermes is the recommended JS engine for React Native.
# It pre-compiles JS to bytecode, giving faster startup and lower memory.
hermesEnabled=true


# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true
